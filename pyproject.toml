[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
    "test/test_parser.py",
    "test/test_healing.py",
    "test/test_healing_config.py",
    "test/test_library_healing.py",
    "test/test_verify_ai_repair.py",
]
# Upstream network/DNS tests remain available via explicit file selection.
